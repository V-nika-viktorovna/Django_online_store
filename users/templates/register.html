{% extends 'basic.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}

<div class="container">
    <div class="row">
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.as_p }}
                    </div>
                    <button type="submit" class="btn btn-primary">
                        Зарегестрироваться
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
