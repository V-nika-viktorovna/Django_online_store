{% extends 'blog/basic_article.html' %}

{% block title %}Добавление статьи{% endblock %}

{% block content %}

<div class="container">
    <div class="row">
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                  <p class="card-taxt">Вы действительно хотите удалить статью: {{object.name}}</p>
                    <div class="card-body">
                        {% csrf_token %}
                    </div>
                    <div class="col-6">
                      <button type="submit" class="btn btn-primary">
                          Удалить
                      </button>
                    <a class="btn btn-primary" href="{% url 'blog:home_article' %}">Отмена</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
